<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Din Browser</title>
    <style>
        /* CSS RESET & DEFAULTS */
        :root {
    /* 🌟 Premium Light Theme (Elegant Daytime: Navy & Aqua) */
    --bg-color: #f5f6fa; /* Soft Grey-White */
    --text-color: #1b263b; /* Dark Navy Blue */
    --card-bg: #ffffff;
    
    --accent-color: #41e2ba; /* Tiffany Blue/Aqua */
    --accent-text: #1b263b; /* Dark Text on Aqua Accent */
    
    --shadow-color: rgba(65, 226, 186, 0.25); /* Aqua Shadow */
    --glow-color: rgba(65, 226, 186, 0.6); /* Vibrant Aqua Glow */
    
    --border-color: #e3e6f0;
    --secondary-text: #6b778d;
    --card-border-radius: 12px;
}

[data-theme="dark"] {
    /* 🌙 Premium Dark Theme (Sophisticated Night: Deep Navy & Gold) */
    --bg-color: #0d1b2a; /* Deep Navy Blue */
    --text-color: #e0f7fa; /* Very Light Aqua */
    --card-bg: #1c2e4a; /* Secondary Dark Navy */
    
    --accent-color: #ffc107; /* Deep Gold/Amber */
    --accent-text: #0d1b2a; /* Deep Navy Text on Gold Accent */
    
    --shadow-color: rgba(255, 193, 7, 0.15); /* Gold Shadow */
    --glow-color: rgba(255, 193, 7, 0.4); /* Gold Glow */
    
    --border-color: #3d5a80;
    --secondary-text: #a9bcd0;
}
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            line-height: 1.6;
            min-height: 100vh;
            /* টেক্সট সিলেকশন হাইলাইট ডিসেবল করা */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            /* মোবাইল ব্রাউজারে ক্লিক ফ্ল্যাশ বন্ধ করা */
            -webkit-tap-highlight-color: transparent !important;
        }

        /* STARTUP GLOW ANIMATION */
        @keyframes startup-glow {
            0% { box-shadow: 0 0 0px var(--glow-color); }
            50% { box-shadow: 0 0 20px var(--glow-color); }
            100% { box-shadow: 0 0 0px var(--glow-color); }
        }

        body.startup {
            animation: startup-glow 2s ease-out;
        }

        /* LAYOUT */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* HEADER */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
width: 100%;
            height: 70px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 5px var(--shadow-color);
            position: relative; /* Centered title-এর জন্য প্রয়োজন */
        }
        
        /* Centered Application Title */
        .app-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 5; 
        }

        /* NEW: Logo Button Styling (Logo is now the reload button) */
        .logo-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70px;
            width: 70px;
            z-index: 10;margin: 0 0 0 -15px;

            /* Ensure it respects the global no-highlight rules */
            outline: none !important;
            box-shadow: none !important;
        }
        .logo-button img {
            width: 100%;
            height: 100%;
        }
        /* Ensure the button doesn't get any extra visual effects on hover/active */
        .logo-button:hover {
            background-color: transparent !important; 
        }
        .logo-button:active {
            background-color: transparent !important;
        }

        .controls {
            z-index: 10; /* Ensure button is clickable */
            display: flex;
            gap: 0.5rem; /* Space between buttons */
        }

        .controls button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s ease;
        }
        
        /* ফোকাস রিং/হাইলাইট বন্ধ করা হলো */
        .controls button:hover {
            background-color: rgba(128, 128, 128, 0.2);
        }
        /* ক্লিক করার সময় যেন কোনো ইফেক্ট না আসে */
        .controls button:active {
            background-color: transparent !important;
        }

        .controls button svg {
            width: 22px;
            height: 22px;
            fill: var(--text-color);
        }

        #incognito-toggle.active svg {
            fill: var(--accent-color);
        }
        
        /* MAIN CONTENT */
        main {
            padding: 1rem 0;
        }

        .search-section {
            text-align: center;
            margin: 2rem 0;
        }
        
        /* SEARCH BOX */
        .search-box-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        #search-input {
            width: 100%;
            padding: 1rem;
            padding-right: 3.5rem; /* Space for the button */
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            box-shadow: 0 4px 10px var(--shadow-color);
            transition: border-color 0.2s, box-shadow 0.2s;
            /* ইনপুট ফিল্ডে সিলেকশন আবার চালু করা */
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        #search-input:focus {
            /* ইনপুটের জন্য ফোকাস স্টাইল: কোনো আউটলাইন নেই, শুধু বক্স শ্যাডো */
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 8px var(--glow-color);
        }

        #search-button {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent-color);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        /* ক্লিক করার সময় কোনো ইফেক্ট যেন না আসে */
        #search-button:active {
            filter: none !important;
        }

        #search-button svg {
            width: 20px;
            height: 20px;
            fill: var(--accent-text);
        }
        
        /* PSE CONTAINERS */
        #search-results {
            margin-top: 2rem;
        }

        /* CARD SECTIONS */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--card-border-radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 12px var(--shadow-color);
            border: 1px solid var(--border-color);
            transition: outline 0.3s ease; /* For delete mode visual cue */
        }

        .card h2 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
        
        /* CENTER QUICK LINKS HEADING */
        #quick-links-card h2 {
            display: block; 
            width: fit-content; 
            margin: 0 auto 1rem auto; /* Center the block itself */
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 0.5rem;
        }

        /* CENTER ADD ITEM BUTTONS */
        .add-item-btn {
            padding: 0.5rem 1rem;
            border: none;
            background-color: var(--accent-color);
            color: var(--accent-text);
            border-radius: 6px;
            cursor: pointer;
            display: block; /* Make it a block element */
            margin: 1rem auto 0 auto; /* Center it horizontally */
            transition: filter 0.2s;
        }
        
        .add-item-btn:hover {
            filter: brightness(0.9); /* Slightly darker on hover for effect */
        }
        /* ক্লিক করার সময় যেন কোনো ইফেক্ট না আসে */
        .add-item-btn:active {
            filter: none !important;
        }
        
        .card ul {
            list-style: none;
        }

        .card li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
        }

        .card a {
            color: var(--accent-color);
            text-decoration: none;
        }
        
        /* কুইক লিংক আইটেম বাটন */
        .quick-link-item a:active {
             background-color: transparent !important;
             transform: none !important;
        }

        .card a:hover {
            text-decoration: underline;
        }

        /* DELETE BUTTON BASE STYLE (for list items) */
        .delete-btn {
            background: none;
            border: none;
            color: var(--secondary-text);
            cursor: pointer;
            padding: 0.2rem;
            transition: color 0.2s;
        }
        /* ক্লিক করার সময় কোনো ইফেক্ট যেন না আসে */
        .delete-btn:active {
            background-color: transparent !important;
        }


        .delete-btn:hover {
            color: #dc3545;
        }
        
        /* QUICK LINKS CONTAINER (FOR VERTICAL SCROLLING) */
        #quick-links-container {
            max-height: 400px; /* Set max-height for vertical scrolling */
            overflow-y: auto;
            padding-right: 10px; /* Space for the scrollbar */
        }
        
        /* QUICK LINKS GRID */
        #quick-links-grid {
            display: grid;
            grid-template-columns: repeat(3, 2fr); /* Fixed 3 columns for better vertical flow */
            gap: 1rem;
            text-align: center;
        }
        
        .quick-link-item {
            position: relative; /* Essential for positioning delete button */
        }
        
        .quick-link-item a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 0.5rem;
            border-radius: 8px;
            transition: background-color 0.2s ease, transform 0.2s;
            text-decoration: none;
            color: var(--text-color);
        }
        
        .quick-link-item a:hover {
            background-color: rgba(128, 128, 128, 0.1);
            text-decoration: none;
            transform: translateY(-2px);
        }

        .quick-link-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            /* REQUESTED: Background removed */
            background-color: transparent; 
            box-shadow: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .quick-link-icon img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }
        
        .quick-link-item span {
            font-size: 0.8rem;
            color: var(--secondary-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        
        /* QUICK LINK DELETE BUTTON FIX: Adjusted position to stay within the item */
        .quick-link-item .delete-btn {
            display: none; /* Hide by default */
            position: absolute;
            top: 5px; /* Adjusted to be inside the container */
            right: 5px; /* Adjusted to be inside the container */
            z-index: 10;
            background-color: #dc3545; /* Red background */
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            min-width: 20px; /* Ensure button size is fixed */
            padding: 0;
            line-height: 1;
            font-size: 14px;
            font-weight: bold;
            opacity: 0.9;
            /* transform: translate(50%, -50%); <-- This line was removed */
            border: 1px solid white;
        }
        
        .quick-link-item .delete-btn:hover {
            opacity: 1;
            background-color: #c82333;
        }

        /* MODALS (for adding items) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background-color: var(--card-bg);
            margin: 10% auto;
            padding: 25px;
            border: 1px solid var(--border-color);
            border-radius: var(--card-border-radius);
            width: 90%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .close-btn {
            color: var(--secondary-text);
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--card-bg);
            color: var(--text-color);
            /* ইনপুট ফিল্ডে সিলেকশন আবার চালু করা */
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        /* ACCESSIBILITY - ULTIMATE FIX */
        :focus, :focus-visible, :active {
            /* FULFILL USER REQUEST: Disable ALL focus outlines/highlights */
            outline: none !important; 
            box-shadow: none !important;
        }
        
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body class="startup">

    <header class="app-header">
        <button id="logo-reload-btn" class="logo-button" aria-label="Din Browser, click to reload">
             <img src="logo.png" alt="Din Browser Logo">
        </button>
        
        <span class="app-title"> Cat 🪩 Browser </span>
        
        <div class="controls">
            <button id="theme-toggle" aria-label="Toggle light/dark theme">
                <svg id="theme-icon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
            </button>
            </div>
    </header>

    <main class="container">
        <section class="search-section" aria-labelledby="search-heading">
             <h1 id="search-heading" class="visually-hidden">Web Search</h1>
             <form id="search-form" class="search-box-container" role="search">
                <div id="pse-searchbox-container">
                    </div>
                <input type="search" id="search-input" placeholder="Search the web...">
                <button type="submit" id="search-button" aria-label="Search">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>
            </form>
        </section>

        <div id="search-results">
             </div>

        <div id="homepage-content">
            <section class="card" id="quick-links-card" aria-labelledby="quick-links-heading">
                <h2 id="quick-links-heading">Quick Links</h2>
                <div id="quick-links-container"> <div id="quick-links-grid"></div>
                </div>
                <button id="add-quick-link-btn" class="add-item-btn" aria-label="Add new quick link">+ Add Link</button>
            </section>

            <section class="card" id="bookmarks-card" aria-labelledby="bookmarks-heading">
                <h2 id="bookmarks-heading">Bookmarks</h2>
                <ul id="bookmarks-list"></ul>
                <button id="add-bookmark-btn" class="add-item-btn" aria-label="Add new bookmark">+ Add Bookmark</button>
            </section>

            </div>
    </main>
    
    <div id="add-item-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" aria-label="Close modal">&times;</span>
            <h3 id="modal-title">Add New Item</h3>
            <form id="add-item-form">
                <input type="hidden" id="item-type-input">
                <div class="form-group">
                    <label for="item-name-input">Name</label>
                    <input type="text" id="item-name-input" required>
                </div>
                <div class="form-group">
                    <label for="item-url-input">URL</label>
                    <input type="url" id="item-url-input" required placeholder="https://example.com">
                </div>
                <button type="submit" class="add-item-btn">Add</button>
            </form>
        </div>
    </div>


    <script>
    document.addEventListener('DOMContentLoaded', () => {

        /* ELEMENT SELECTORS */
        const themeToggle = document.getElementById('theme-toggle');
        const logoReloadBtn = document.getElementById('logo-reload-btn'); // NEW: Logo Button selector
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const searchResultsContainer = document.getElementById('search-results');
        const homepageContent = document.getElementById('homepage-content');
        
        const quickLinksGrid = document.getElementById('quick-links-grid');
        const bookmarksList = document.getElementById('bookmarks-list');
        
        const addQuickLinkBtn = document.getElementById('add-quick-link-btn');
        const addBookmarkBtn = document.getElementById('add-bookmark-btn');
        
        const modal = document.getElementById('add-item-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalForm = document.getElementById('add-item-form');
        const itemTypeInput = document.getElementById('item-type-input');
        const itemNameInput = document.getElementById('item-name-input');
        const itemUrlInput = document.getElementById('item-url-input');
        const closeModalBtn = document.querySelector('.close-btn');

        /* Default Quick Links List */
        const DEFAULT_QUICK_LINKS = [
            { name: 'YouTube', url: 'https://youtube.com' },
            { name: 'Facebook', url: 'https://facebook.com' },
            { name: 'Google', url: 'https://google.com' },
            { name: 'GitHub', url: 'https://github.com' },
            { name: 'Amazon', url: 'https://amazon.com' },
            { name: 'Wikipedia', url: 'https://wikipedia.org' },
        ];
        
        let isIncognito = false; 
        
        /* State and variables for deletion mode */
        let deleteModeActive = false;
        let pressTimer = null;
        const LONG_PRESS_THRESHOLD = 700; // ms

        /* INITIALIZATION */
        const init = () => {
            applyTheme();
            loadAllData();
            setTimeout(() => document.body.classList.remove('startup'), 500);
        };
        
        /* THEME MANAGEMENT */
        const applyTheme = () => {
            const storedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (storedTheme === 'dark' || (!storedTheme && systemPrefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        };

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
        
        /* LOGO RELOAD Functionality */
        logoReloadBtn.addEventListener('click', () => {
            // Reloads the entire browser page when the logo is clicked
            window.location.reload();
        });


        /* LOCAL STORAGE MANAGEMENT */
        const getData = (key, defaultValue = []) => {
            const data = localStorage.getItem(key);
            try {
                // Return default value if data is null (key not found)
                if (!data) return defaultValue; 
                
                return JSON.parse(data);
            } catch (e) {
                console.error(`Error parsing ${key} from localStorage`, e);
                return defaultValue;
            }
        };
        
        const setData = (key, value) => {
            if (isIncognito) return;
            localStorage.setItem(key, JSON.stringify(value));
        };

        const clearAllData = () => {
            if (confirm('Are you sure you want to clear all links and bookmarks? This cannot be undone.')) {
                localStorage.removeItem('quickLinks');
                localStorage.removeItem('bookmarks');
                loadAllData();
            }
        };
        
        /* DATA RENDERING */
        const loadAllData = () => {
            renderQuickLinks();
            renderBookmarks();
        };
        
        /* Function to toggle delete mode (for quick links) */
        const toggleDeleteMode = (state) => {
            deleteModeActive = state !== undefined ? state : !deleteModeActive;
            const deleteButtons = document.querySelectorAll('#quick-links-grid .delete-btn');
            const card = document.getElementById('quick-links-card');
            
            deleteButtons.forEach(btn => {
                btn.style.display = deleteModeActive ? 'block' : 'none';
                btn.style.cursor = 'pointer'; 
            });

            // Visual cue for delete mode
            if (deleteModeActive) {
                card.style.outline = '2px dashed #dc3545';
            } else {
                card.style.outline = 'none';
            }
        };

        const renderQuickLinks = () => {
            let links = getData('quickLinks', []); // Load saved links or an empty array
            
            // FIX: If the quick links list is empty, restore the default links and save them.
            if (links.length === 0 && !isIncognito) {
                 links = DEFAULT_QUICK_LINKS;
                 setData('quickLinks', links); // Save defaults so they persist
            }
            
            quickLinksGrid.innerHTML = links.map((link, index) => `
                <div class="quick-link-item">
                     <a href="${link.url}" target="_blank" rel="noopener noreferrer" data-index="${index}">
                         <div class="quick-link-icon">
                             <img src="https://www.google.com/s2/favicons?sz=64&domain_url=${link.url}" alt="${link.name} favicon">
                         </div>
                         <span>${link.name}</span>
                     </a>
                     <button class="delete-btn" data-type="quickLink" data-index="${index}" aria-label="Delete ${link.name} quick link">&times;</button>
                 </div>
            `).join('');
            
            // Re-apply visibility after rendering if delete mode is active
            if (deleteModeActive) {
                toggleDeleteMode(true);
            }
        };
        
        const renderBookmarks = () => {
            const bookmarks = getData('bookmarks', []);
            bookmarksList.innerHTML = bookmarks.map((bookmark, index) => `
                <li>
                    <a href="${bookmark.url}" target="_blank" rel="noopener noreferrer">${bookmark.name}</a>
                    <button class="delete-btn" data-type="bookmark" data-index="${index}" aria-label="Delete ${bookmark.name} bookmark">&times;</button>
                </li>
            `).join('') || '<li><span style="color: var(--secondary-text);">No bookmarks yet.</span></li>';
        };
        
        /* DELETION MODE LOGIC (Click and Hold) */
        
        // Start timer on mouse down or touch start
        quickLinksGrid.addEventListener('mousedown', (e) => {
            const item = e.target.closest('.quick-link-item');
            if (item && !e.target.closest('.delete-btn')) {
                pressTimer = setTimeout(() => {
                    e.preventDefault(); 
                    toggleDeleteMode(true);
                }, LONG_PRESS_THRESHOLD);
            }
        });

        quickLinksGrid.addEventListener('touchstart', (e) => {
            const item = e.target.closest('.quick-link-item');
            if (item && !e.target.closest('.delete-btn')) {
                pressTimer = setTimeout(() => {
                    e.preventDefault(); 
                    toggleDeleteMode(true);
                }, LONG_PRESS_THRESHOLD);
            }
        }, { passive: false }); // Use non-passive to allow preventDefault

        // Clear timer on mouse up or touch end/move
        const clearPressTimer = () => {
            clearTimeout(pressTimer);
            pressTimer = null;
        };
        quickLinksGrid.addEventListener('mouseup', clearPressTimer);
        quickLinksGrid.addEventListener('touchend', clearPressTimer);
        quickLinksGrid.addEventListener('touchmove', clearPressTimer); // Clear on move to cancel long press

        // Handle clicks on quick links (both delete and navigation)
        quickLinksGrid.addEventListener('click', (e) => {
             const target = e.target;
             
             // 1. Handle delete button click
             if (target.classList.contains('delete-btn') || target.closest('.delete-btn')) {
                e.preventDefault();
                e.stopPropagation();
                
                const deleteButton = target.closest('.delete-btn');
                const index = parseInt(deleteButton.dataset.index, 10);
                
                if (isIncognito) {
                    alert('Cannot delete data in Incognito mode.');
                    return;
                }

                const links = getData('quickLinks');
                links.splice(index, 1);
                setData('quickLinks', links);
                renderQuickLinks();
                
                // If the last link was deleted, turn off delete mode
                if(links.length === 0) {
                    toggleDeleteMode(false);
                } 

             } 
             // 2. Handle click on a link item while in delete mode
             else if (deleteModeActive) {
                const item = target.closest('.quick-link-item');
                if (item) {
                   e.preventDefault(); // Prevent navigation
                   e.stopPropagation();
                }
                // Click anywhere in the grid (not a button) will exit delete mode
                toggleDeleteMode(false);
             }
        });
        
        // Handle clicks for list item deletion (bookmarks/history)
        document.body.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn') && !e.target.closest('#quick-links-grid')) {
                const type = e.target.dataset.type;
                const index = parseInt(e.target.dataset.index, 10);
                
                if (isIncognito) {
                    alert('Cannot delete data in Incognito mode.');
                    return;
                }
                
                if (type === 'bookmark') {
                    const bookmarks = getData('bookmarks');
                    bookmarks.splice(index, 1);
                    setData('bookmarks', bookmarks);
                    renderBookmarks();
                } 
            }
        });


        /* ADD/DELETE ITEMS MODAL */
        const openModal = (type) => {
            toggleDeleteMode(false); // Disable delete mode when opening modal
            modal.style.display = 'block';
            modalTitle.textContent = type === 'quickLink' ? 'Add New Quick Link' : 'Add New Bookmark';
            itemTypeInput.value = type;
            modalForm.reset();
            itemNameInput.focus();
        };

        const closeModal = () => {
            modal.style.display = 'none';
        };
        
        addQuickLinkBtn.addEventListener('click', () => openModal('quickLink'));
        addBookmarkBtn.addEventListener('click', () => openModal('bookmark'));
        closeModalBtn.addEventListener('click', closeModal);
        window.addEventListener('click', (e) => {
            if (e.target == modal) closeModal();
        });

        modalForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const type = itemTypeInput.value;
            const name = itemNameInput.value.trim();
            let url = itemUrlInput.value.trim();
            
            if (!url.startsWith('http')) {
                url = 'https://' + url;
            }

            if (name && url) {
                if (type === 'quickLink') {
                    const links = getData('quickLinks');
                    links.push({ name, url });
                    setData('quickLinks', links);
                    renderQuickLinks();
                } else if (type === 'bookmark') {
                    const bookmarks = getData('bookmarks');
                    bookmarks.push({ name, url });
                    setData('bookmarks', bookmarks);
                    renderBookmarks();
                }
                closeModal();
            }
        });

        
        /* SEARCH FUNCTIONALITY */
        const handleSearch = (query) => {
            if (!query) return;
            
            toggleDeleteMode(false); // Disable delete mode on search

            // PSE Integration Check
            if (typeof google !== 'undefined' && google.search.cse) {
                 // If PSE is loaded, it will handle search.
                 // Show results and hide homepage
                 homepageContent.style.display = 'none';
                 searchResultsContainer.style.display = 'block';
            } else {
                // Fallback search
                const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                window.open(searchUrl, '_blank');
            }
            searchInput.value = '';
        };

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            handleSearch(query);
        });
        
        /* PSE WIRING */
        const checkForPSE = () => {
             const pseScript = document.querySelector('script[src*="cse.google.com"]');
             if(pseScript) {
                // PSE script is present. Hide fallback and show PSE container.
                document.getElementById('search-input').style.display = 'none';
                document.getElementById('search-button').style.display = 'none';
                document.getElementById('pse-searchbox-container').style.display = 'block';
             } else {
                // PSE script is not present. Use fallback.
                document.getElementById('pse-searchbox-container').style.display = 'none';
             }
        };

        checkForPSE();
        
        // Run initializer
        init();
    });
    </script>
</body>
</html>
